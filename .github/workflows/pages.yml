name: Frontend verification and Pages release

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "frontend/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified frontend to GitHub Pages"
        required: true
        type: boolean
        default: false

concurrency:
  group: dracula-pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_ORIGIN: https://api.ian-tincknell.com
      VITE_BASE_PATH: /Dracula/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run verify:build
      - name: Upload verified Pages payload
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy frontend artifact
        id: deployment
        uses: actions/deploy-pages@v4
