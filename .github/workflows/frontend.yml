name: Frontend verification

on:
  pull_request:
    paths:
      - ".github/workflows/frontend.yml"
      - "frontend/**"
      - "deployment/cloudflare/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      # This produces the same-origin frontend copied into the Lambda image.
      # Publication happens with that image, never as a separate Pages release.
      - run: npm --prefix frontend run check
      - run: node --test deployment/cloudflare/worker.test.mjs
