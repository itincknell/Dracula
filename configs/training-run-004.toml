# Retain the top three training-003 tournament policies. policy-0 and policy-4
# intentionally have no checkpoints and initialize randomly.

[run]
run_id = "training-004"
root_seed = "dracula-training-004-20260721"
iteration_count = 20
output_directory = "../runs"
profile = "full"
retain_collections = false

[population]
policy_ids = ["policy-0", "policy-1", "policy-2", "policy-3", "policy-4"]
critic_checkpoint = "../runs/training-003/checkpoints/000039/post-update.pt"

[population.policy_checkpoints]
policy-1 = "../runs/training-003/archives/policy-1-policy-1-v40.pt"
policy-2 = "../runs/training-003/archives/policy-2-policy-2-v40.pt"
policy-3 = "../runs/training-003/archives/policy-3-policy-3-v40.pt"

[fixtures]
collection_lane_count = 12
collection_generations = 16
collection_lane_roots = [
  "training-004-collection-lane-00", "training-004-collection-lane-01",
  "training-004-collection-lane-02", "training-004-collection-lane-03",
  "training-004-collection-lane-04", "training-004-collection-lane-05",
  "training-004-collection-lane-06", "training-004-collection-lane-07",
  "training-004-collection-lane-08", "training-004-collection-lane-09",
  "training-004-collection-lane-10", "training-004-collection-lane-11",
]
held_out_lane_count = 12
held_out_generations = 4
held_out_lane_roots = [
  "training-004-held-out-lane-00", "training-004-held-out-lane-01",
  "training-004-held-out-lane-02", "training-004-held-out-lane-03",
  "training-004-held-out-lane-04", "training-004-held-out-lane-05",
  "training-004-held-out-lane-06", "training-004-held-out-lane-07",
  "training-004-held-out-lane-08", "training-004-held-out-lane-09",
  "training-004-held-out-lane-10", "training-004-held-out-lane-11",
]

[compute]
collection_device = "cpu"
optimization_device = "cpu"
trajectory_batch_size = 16

[training]
actor_learning_rate = 0.00015
critic_learning_rate = 0.0005
ppo_clip = 0.2
approximate_kl_limit = 0.015
burn_in_entropy_coefficient = 0.001
trained_entropy_coefficient = 0.001
critic_validation_improvement = 0.05
critic_validation_consecutive_windows = 3
critic_minimum_collected_rounds = 1
actor_ramp_collected_rounds = 1
actor_weight_start = 0.3
actor_weight_end = 0.3
actor_requires_critic_validation = false
