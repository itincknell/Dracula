[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dracula-game"
version = "0.1.0"
description = "Dracula game engine and learned opponent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139,<0.140",
    "pydantic>=2.12,<3",
    "torch>=2.7,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
dracula-belief-greedy-miner = "dracula.belief_greedy_miner:main"
dracula-bgc-policy-evaluation = "dracula.bgc_policy_evaluation:main"
dracula-bgc-policy-training = "dracula.bgc_policy_training:main"
dracula-bgc-pi0-miner = "dracula.bgc_pi0_miner:main"
dracula-sam-miner = "dracula.sam_miner:main"
dracula-sam-policy-training = "dracula.sam_policy_training:main"

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.setuptools.packages.find]
where = ["src"]
