[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dracula-game"
version = "0.1.0"
description = "Dracula game engine and learned opponent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139,<0.140",
    "pydantic>=2.12,<3",
    "torch>=2.7,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
dracula-policy-training = "dracula.policy.training.cli:main"

[project.optional-dependencies]
bedrock = [
    "boto3==1.43.83",
    "botocore[crt]>=1.43.83,<1.44",
]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.setuptools.packages.find]
where = ["src"]
