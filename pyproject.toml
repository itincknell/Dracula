[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dracula-game"
version = "0.1.0"
description = "Dracula game engine and learned opponent"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7,<3",
]

[project.scripts]
dracula-train = "dracula.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
