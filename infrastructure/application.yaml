AWSTemplateFormatVersion: "2010-09-09"
Description: Dracula frontend, stateless FastAPI, Lambda, and Bedrock.

Metadata:
  cfn-lint:
    config:
      ignore_checks: [W1030]

Parameters:
  # Deployment commands supply environment-specific resource, capacity, and
  # integration choices. Bounds reject accidental unbounded Lambda settings.
  ProjectName:
    Type: String
    Default: dracula-api
    AllowedPattern: "[a-z][a-z0-9-]{2,31}"
  EnvironmentName:
    Type: String
    AllowedValues: [staging, production]
  ImageUri:
    Type: String
    Description: Immutable ECR image URI including an at-sign SHA-256 digest.
    AllowedPattern: ".+@sha256:[0-9a-f]{64}"
  LambdaMemoryMb:
    Type: Number
    Default: 2048
    MinValue: 1024
    MaxValue: 10240
  LambdaTimeoutSeconds:
    Type: Number
    Default: 20
    MinValue: 10
    MaxValue: 28
  ReservedConcurrency:
    Type: Number
    Default: 2
    MinValue: -1
    MaxValue: 20
    Description: Function cap; -1 uses the shared account concurrency pool.
  ReplayCacheEntries:
    Type: Number
    Default: 256
    MinValue: 0
    MaxValue: 2048
  NarrationEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  BedrockModelId:
    Type: String
    Default: ""
  BedrockModelArn:
    Type: String
    Default: ""
    AllowedPattern: "(^$)|(^arn:aws[a-zA-Z-]*:bedrock:.+$)"
  NarrationTimeoutSeconds:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 15
  NarrationMaxTokens:
    Type: Number
    Default: 96
    MinValue: 1
    MaxValue: 256
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [7, 14, 30, 60, 90]
  MonthlyBudgetUsd:
    Type: Number
    Default: 0
    MinValue: 0
  BudgetNotificationEmail:
    Type: String
    Default: ""
  AlarmNotificationEmail:
    Type: String
    Default: ""

Rules:
  # CloudFormation stops before creating resources when optional features have
  # only part of their required configuration.
  NarrationConfigurationIsComplete:
    RuleCondition: !Equals [!Ref NarrationEnabled, "true"]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref BedrockModelId, ""]]
          - !Not [!Equals [!Ref BedrockModelArn, ""]]
        AssertDescription: Narration requires both a Bedrock model ID and ARN.
  BudgetConfigurationIsComplete:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref MonthlyBudgetUsd, "0"]
            - !Equals [!Ref BudgetNotificationEmail, ""]
          - !And
            - !Not [!Equals [!Ref MonthlyBudgetUsd, "0"]]
            - !Not [!Equals [!Ref BudgetNotificationEmail, ""]]
        AssertDescription: Monthly budget and notification email must be supplied together.

Conditions:
  # Optional Bedrock, concurrency reservation, alarm, and budget settings disappear
  # entirely when their corresponding parameter group is disabled.
  NarrationIsEnabled: !Equals [!Ref NarrationEnabled, "true"]
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, "-1"]]
  HasMonthlyBudget: !Not [!Equals [!Ref MonthlyBudgetUsd, "0"]]
  HasAlarmNotification: !Not [!Equals [!Ref AlarmNotificationEmail, ""]]

Resources:
  # Lambda and API Gateway write to explicit retained log groups rather than
  # allowing implicit groups with unlimited retention.
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${ProjectName}-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  FunctionRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteApplicationLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt FunctionLogGroup.Arn
        - !If
          - NarrationIsEnabled
          - PolicyName: InvokeSelectedBedrockModel
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: bedrock:InvokeModel
                  Resource: !Ref BedrockModelArn
          - !Ref AWS::NoValue
      Tags:
        - Key: Application
          Value: dracula
        - Key: Environment
          Value: !Ref EnvironmentName

  GameplayFunction:
    Type: AWS::Lambda::Function
    Properties:
      Architectures: [arm64]
      Code:
        ImageUri: !Ref ImageUri
      Description: Stateless Dracula gameplay and optional narration API.
      Environment:
        Variables:
          # Keep initialization progress when loading PyTorch exceeds Lambda's
          # initial ten-second window; readiness still gates the first request.
          AWS_LWA_ASYNC_INIT: "true"
          DRACULA_BEDROCK_MODEL_ID: !Ref BedrockModelId
          DRACULA_BEDROCK_REGION: !Ref AWS::Region
          DRACULA_NARRATION_ENABLED: !Ref NarrationEnabled
          DRACULA_NARRATION_MAX_TOKENS: !Ref NarrationMaxTokens
          DRACULA_NARRATION_TIMEOUT_SECONDS: !Ref NarrationTimeoutSeconds
          DRACULA_REPLAY_CACHE_ENTRIES: !Ref ReplayCacheEntries
      EphemeralStorage:
        Size: 512
      FunctionName: !Sub ${ProjectName}-${EnvironmentName}
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref FunctionLogGroup
        SystemLogLevel: INFO
      MemorySize: !Ref LambdaMemoryMb
      PackageType: Image
      ReservedConcurrentExecutions: !If
        - HasReservedConcurrency
        - !Ref ReservedConcurrency
        - !Ref AWS::NoValue
      Role: !GetAtt FunctionRole.Arn
      Timeout: !Ref LambdaTimeoutSeconds
      Tags:
        - Key: Application
          Value: dracula
        - Key: Environment
          Value: !Ref EnvironmentName

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Description: Stateless Dracula gameplay HTTP API.
      DisableExecuteApiEndpoint: false
      Name: !Sub ${ProjectName}-${EnvironmentName}
      ProtocolType: HTTP
      Tags:
        Application: dracula
        Environment: !Ref EnvironmentName

  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationMethod: POST
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GameplayFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 29000

  ApplicationRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      AuthorizationType: NONE
      RouteKey: ANY /Dracula
      Target: !Sub integrations/${LambdaIntegration}

  ApplicationRoute:
    # Forward the full application path; FastAPI separates files from JSON routes.
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      AuthorizationType: NONE
      RouteKey: ANY /Dracula/{proxy+}
      Target: !Sub integrations/${LambdaIntegration}

  StaticGetRoute:
    # A page loads several images/fonts together. Give GETs their own burst
    # allowance without increasing the rate of gameplay or Bedrock POSTs.
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      AuthorizationType: NONE
      RouteKey: GET /Dracula/{proxy+}
      Target: !Sub integrations/${LambdaIntegration}

  HttpStage:
    Type: AWS::ApiGatewayV2::Stage
    # RouteSettings names a route by text, so CloudFormation cannot infer this
    # dependency. API Gateway requires that route to exist before stage creation.
    DependsOn: [ApplicationRootRoute, ApplicationRoute, StaticGetRoute]
    Properties:
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLatency":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}
      ApiId: !Ref HttpApi
      AutoDeploy: true
      DefaultRouteSettings:
        DetailedMetricsEnabled: false
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      RouteSettings:
        "GET /Dracula/{proxy+}":
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20
      StageName: $default
      Tags:
        Application: dracula
        Environment: !Ref EnvironmentName

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GameplayFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  OperationalAlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmNotification
    Properties:
      DisplayName: !Sub ${ProjectName}-${EnvironmentName}-alarms
      Subscription:
        - Endpoint: !Ref AlarmNotificationEmail
          Protocol: email
      Tags:
        - Key: Application
          Value: dracula
        - Key: Environment
          Value: !Ref EnvironmentName

  FunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      ActionsEnabled: true
      AlarmName: !Sub ${ProjectName}-${EnvironmentName}-lambda-errors
      AlarmActions: !If
        - HasAlarmNotification
        - [!Ref OperationalAlarmTopic]
        - !Ref AWS::NoValue
      AlarmDescription: Stateless gameplay Lambda returned one or more errors in five minutes.
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref GameplayFunction
      EvaluationPeriods: 1
      MetricName: Errors
      Namespace: AWS/Lambda
      Period: 300
      Statistic: Sum
      Threshold: 1
      TreatMissingData: notBreaching
      Tags:
        - Key: Application
          Value: dracula
        - Key: Environment
          Value: !Ref EnvironmentName

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      ActionsEnabled: true
      AlarmName: !Sub ${ProjectName}-${EnvironmentName}-api-5xx
      AlarmActions: !If
        - HasAlarmNotification
        - [!Ref OperationalAlarmTopic]
        - !Ref AWS::NoValue
      AlarmDescription: Stateless gameplay HTTP API returned one or more 5xx responses in five minutes.
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
        - Name: Stage
          Value: $default
      EvaluationPeriods: 1
      MetricName: 5xx
      Namespace: AWS/ApiGateway
      Period: 300
      Statistic: Sum
      Threshold: 1
      TreatMissingData: notBreaching
      Tags:
        - Key: Application
          Value: dracula
        - Key: Environment
          Value: !Ref EnvironmentName

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasMonthlyBudget
    Properties:
      Budget:
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        BudgetName: !Sub ${ProjectName}-${EnvironmentName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref BudgetNotificationEmail
              SubscriptionType: EMAIL

Outputs:
  ApiId:
    Value: !Ref HttpApi
  DefaultApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  FunctionArn:
    Value: !GetAtt GameplayFunction.Arn
  OperationalAlarmTopicArn:
    Condition: HasAlarmNotification
    Value: !Ref OperationalAlarmTopic
